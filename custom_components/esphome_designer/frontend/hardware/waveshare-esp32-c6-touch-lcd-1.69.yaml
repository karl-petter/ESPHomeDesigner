# ============================================================================
# ESPHome YAML - Generated by ESPHome Designer
# ============================================================================
# TARGET DEVICE: Waveshare ESP32-C6 Touch LCD 1.69" 240x280
#         - Display Platform: mipi_spi, model ST7789V (chip: ST7789V2)
#         - Touchscreen: CST816T (I2C)
#         - Audio: ES8311 codec (mic + streaming media_player) over I2S
#         - PSRAM: No
#         - Framework: ESP-IDF
# Name: Waveshare ESP32-C6 Touch LCD 1.69"
# Resolution: 240x280
# Shape: rect
# Inverted: true
# Orientation: portrait
# Dark Mode: disabled
# ============================================================================
#
# BASED ON: https://www.waveshare.com/esp32-c6-touch-lcd-1.69.htm
# Hardware configuration adapted for ESPHome Designer.
#
# ============================================================================
#
# SETUP INSTRUCTIONS:
#
# STEP 1: Copy the Material Design Icons font file
#         - From this repo: resources/fonts/materialdesignicons-webfont.ttf
#         - To ESPHome: /config/esphome/fonts/materialdesignicons-webfont.ttf
#         (Create the fonts folder if it doesn't exist)
#
# STEP 2: Create a new device in ESPHome
#         - Click "New Device"
#         - Name: your-device-name
#         - Select: ESP32-C6
#         - Framework: ESP-IDF (Required for this device)
#
# STEP 3: PASTE this snippet into your device YAML
#         - Paste this snippet at the end of your configuration.
#         - System sections (esphome, esp32, etc.) are auto-commented
#           to avoid conflicts with your existing setup.
#
# ============================================================================
#
# ON-BOARD BUT NOT WIRED UP BY THIS RECIPE:
#   - RTC (PCF85063) and IMU (QMI8658, 6-axis) share the I2C bus below.
#   - Battery ADC on GPIO0 (drive the GPIO15 enable pin HIGH before reading).
# The RESET button is a direct hardware reset (EN pin) and isn't visible to
# ESPHome; the BOOT and PWR buttons are wired below as binary sensors.
# Add the matching ESPHome components yourself if your project needs anything else.
# ============================================================================

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_DETECT: y
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y
      CONFIG_OPENTHREAD_ENABLED: n
      CONFIG_USE_MINIMAL_MDNS: y
      # Memory optimization
      COMPILER_OPTIMIZATION_SIZE: y
      COMPILER_OPTIMIZATION_LEVEL_RELEASE: y
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE: y
      CONFIG_HEAP_POISONING_DISABLED: y

spi:
  mosi_pin: 2
  clk_pin: 1

i2c:
  sda: 8
  scl: 7

# skip_probe: the boot-time chip-ID read races the chip and fails on this
# board, even though the chip answers fine once running (confirmed via I2C
# bus scan and live touch reads at address 0x15).
touchscreen:
  platform: cst816
  id: my_touchscreen
  interrupt_pin: 11
  skip_probe: true

binary_sensor:
  - platform: gpio
    id: boot_button
    name: "Boot Button"
    pin:
      number: 9
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
  - platform: gpio
    id: power_button
    name: "Power Button"
    pin:
      number: 18
      mode: INPUT_PULLUP
      inverted: true

audio_dac:
  - platform: es8311
    id: es8311_dac
    address: 0x18
    use_microphone: true

i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: 22
    i2s_bclk_pin: 20
    i2s_mclk_pin: 19

# The mixer lets announcements (TTS, chimes) duck in over music without
# fighting the media stream for the one physical i2s_audio output.
speaker:
  - platform: i2s_audio
    id: es8311_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: 23
    dac_type: external
  - platform: mixer
    id: media_mixer
    output_speaker: es8311_speaker
    source_speakers:
      - id: announcement_speaker
      - id: media_speaker

microphone:
  - platform: i2s_audio
    id: es8311_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: 21
    adc_type: external
    channel: left

# Exposes a media_player entity in Home Assistant that can play/stream audio.
# This board has no PSRAM, so buffer_size is kept small (default is 1MB,
# which won't fit in the C6's 512KB SRAM); raise it only after checking
# free heap, since a stream that's too large will overflow and crash.
# format: NONE on each pipeline requests FLAC+MP3+Opus+WAV decode support;
# without it, only the pipeline's default (FLAC) codec gets compiled in.
media_player:
  - platform: speaker
    name: "Media Player"
    id: media_player_out
    buffer_size: 32000
    announcement_pipeline:
      speaker: announcement_speaker
      format: NONE
    media_pipeline:
      speaker: media_speaker
      format: NONE

output:
  - platform: ledc
    pin: 6
    id: gpio_backlight_pwm

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: "Display Backlight"
    id: display_backlight
    restore_mode: RESTORE_AND_ON

# https://esphome.io/components/display/
# TFT Display (ST7789V2, 240x280, 20px row offset).
# Uses mipi_spi (not the deprecated st7789v platform) so invert_colors and
# color_order are actually configurable. Confirmed on hardware: this panel
# needs invert_colors: true (matches the sibling Waveshare C6-LCD-1.47's own
# invert_colors: true in ESPHome's mipi_spi model list) and color_order: RGB
# (the ST7789V model's default of BGR swaps red and blue on this panel).
display:
  - platform: mipi_spi
    id: my_display
    model: ST7789V
    cs_pin: 5
    dc_pin: 3
    reset_pin: 4
    data_rate: 40MHz
    dimensions:
      width: 240
      height: 280
      offset_width: 0
      offset_height: 20
    invert_colors: true
    color_order: RGB
    # __LAMBDA_PLACEHOLDER__
