esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

i2c:
  sda: 5
  scl: 6
  id: bus_a
  frequency: 800kHz

display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    id: my_display
