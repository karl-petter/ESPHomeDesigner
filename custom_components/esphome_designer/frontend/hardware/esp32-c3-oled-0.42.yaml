substitutions:
  name: "esp32_c3_oled_042"
  id: esp32_c3_oled_042
  friendly_name: 'ESP32-C3-OLED-0.42"'
  device_description: "ESP32-C3 OLED 0.42 inch"
  project_name: "karl-petter.ESPHomeDesigner_ESP32-C3-OLED-0_42"
  project_version: "1.0.0"
  # GPIO pins for i2c
  sdapin: GPIO5
  sclpin: GPIO6
  # LED
  rgb_led: GPIO8
  logger: "DEBUG"

esp32:
  board: esp32-c3-devkitm-1
  flash_size: 4MB
  framework:
    type: esp-idf

esphome:
  friendly_name: $friendly_name
  name: $name
  project:
    name: "${project_name}"
    version: "${project_version}"

i2c:
  sda: $sdapin
  scl: $sclpin
  id: bus_a
  frequency: 800kHz

display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    id: my_display
    # __LAMBDA_PLACEHOLDER__