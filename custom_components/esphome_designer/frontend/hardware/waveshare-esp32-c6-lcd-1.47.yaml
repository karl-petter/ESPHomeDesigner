# ============================================================================
# ESPHome YAML - Generated by ESPHome Designer
# ============================================================================
# TARGET DEVICE: Waveshare ESP32-C6 LCD 1.47" 172x320
#         - Display Platform: st7789v
#         - PSRAM: No
#         - Touchscreen: None
#         - Framework: ESP-IDF
# Name: Waveshare ESP32-C6 LCD 1.47"
# Resolution: 172x320
# Shape: rect
# Inverted: false
# Orientation: portrait
# Dark Mode: disabled
# ============================================================================
#
# BASED ON: https://www.waveshare.com/esp32-c6-lcd-1.47.htm
# Hardware configuration adapted for ESPHome Designer.
#
# ============================================================================
#
# SETUP INSTRUCTIONS:
#
# STEP 1: Copy the Material Design Icons font file
#         - From this repo: resources/fonts/materialdesignicons-webfont.ttf
#         - To ESPHome: /config/esphome/fonts/materialdesignicons-webfont.ttf
#         (Create the fonts folder if it doesn't exist)
#
# STEP 2: Create a new device in ESPHome
#         - Click "New Device"
#         - Name: your-device-name
#         - Select: ESP32-C6
#         - Framework: ESP-IDF (Required for this device)
#
# STEP 3: PASTE this snippet into your device YAML
#         - Paste this snippet at the end of your configuration.
#         - System sections (esphome, esp32, psram, etc.) are auto-commented
#           to avoid conflicts with your existing setup.
#
# ============================================================================

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_DETECT: y
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
      CONFIG_OPENTHREAD_ENABLED: n
      CONFIG_USE_MINIMAL_MDNS: y
      # Memory optimization
      COMPILER_OPTIMIZATION_SIZE: y
      COMPILER_OPTIMIZATION_LEVEL_RELEASE: y
      CONFIG_COMPILER_OPTIMIZATION_ASSERTIONS_DISABLE: y
      CONFIG_HEAP_POISONING_DISABLED: y

esphome:
  platformio_options:
    board_build.flash_mode: dio
    build_flags:
      - "-DI2C_NUM_1=I2C_NUM_0"
      - "-DBOARD_HAS_PSRAM"
      - "-Wl,-Map,output.map"
    board_build.arduino.memory_type: qio_opi

spi:
  mosi_pin: 6
  miso_pin: 5
  clk_pin: 7

i2c:
  sda: 1
  scl: 2

one_wire:
  - pin: 10
    platform: gpio

text_sensor:
  # ESPHome Version
  - platform: version
    name: "ESPHome Version"
    id: c6_lcd_147_esphome_version
    icon: si:esphomes
    hide_timestamp: 'true'
    entity_category: diagnostic
  # WiFi Info: IP, MAC, SSID, BSSID, Scan
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:ip
      entity_category: diagnostic
      disabled_by_default: True
    mac_address:
      name: "WiFi MAC Address"
      icon: mdi:fingerprint
      entity_category: diagnostic
      disabled_by_default: True
    ssid:
      name: "Connected SSID"
      icon: mdi:wifi-settings
      entity_category: diagnostic
      disabled_by_default: True
    bssid:
      name: "Connected BSSID"
      icon: mdi:wifi
      entity_category: diagnostic
      disabled_by_default: True
    scan_results:
      name: "Latest Scan Results"
      icon: mdi:wifi-sync
      entity_category: diagnostic
      disabled_by_default: True

binary_sensor:
  # https://esphome.io/components/binary_sensor/status.html
  # Reports if this device is Connected or not
  - platform: status
    name: "Status"
    id: c6_lcd_147_status
    icon: mdi:check-network
    entity_category: diagnostic

light:
  # RGB LED
  - platform: esp32_rmt_led_strip
    pin:
      number: 8
      ignore_strapping_warning: true
    name: "RGB LED"
    id: rgb_led
    chipset: ws2812
    num_leds: 1
    rgb_order: RGB
    default_transition_length: 2s
    restore_mode: RESTORE_DEFAULT_OFF
  # Display backlight - follows the project's display_backlight convention
  # (see sunton-esp32-2432s028R.yaml) instead of a standalone number entity,
  # so it can be dimmed directly as a light (light.turn_on brightness:).
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON

output:
  - platform: ledc
    pin: 22
    id: gpio_backlight_pwm
    frequency: 1000 Hz

# https://esphome.io/components/display/
# TFT Display (ST7789)
display:
  - platform: st7789v
    cs_pin: 14
    dc_pin:
      number: 15
      ignore_strapping_warning: true
    reset_pin: 21
    model: Waveshare 1.47in 172X320
    id: my_display
    rotation: 0
    # __LAMBDA_PLACEHOLDER__
